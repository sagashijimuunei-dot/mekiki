<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- 背景のポップな微細パターン（メキキ全般：虫めがね・カプセル・さかな・にくきゅう）。可読性を損なわないよう極薄 -->
  <g fill="none" stroke="#2E2C39" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.06">
    <!-- 虫めがね（目利き） -->
    <g transform="translate(36 40)"><circle cx="0" cy="0" r="12"/><line x1="8.5" y1="8.5" x2="20" y2="20"/></g>
    <!-- カプセル（サプリ） -->
    <rect x="170" y="36" width="48" height="20" rx="10" transform="rotate(16 194 46)"/>
    <!-- さかな（釣り） -->
    <g transform="translate(62 186)"><ellipse cx="0" cy="0" rx="18" ry="10"/><path d="M16 0 L27 -8 L27 8 Z"/></g>
    <!-- にくきゅう（ペット） -->
    <g transform="translate(196 190)"><ellipse cx="0" cy="4" rx="8" ry="6.5"/><circle cx="-8" cy="-6" r="3.2"/><circle cx="-2.5" cy="-11" r="3.2"/><circle cx="3.5" cy="-11" r="3.2"/><circle cx="9" cy="-6" r="3.2"/></g>
    <circle cx="130" cy="112" r="5.5"/>
  </g>
  <g opacity="0.08">
    <circle cx="224" cy="222" r="6" fill="#FB7B52"/>
    <circle cx="140" cy="28" r="5" fill="#FFC24B"/>
    <circle cx="26" cy="132" r="5" fill="#57B3E8"/>
    <circle cx="120" cy="236" r="5" fill="#A483D9"/>
  </g>
</svg>
